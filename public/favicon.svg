  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#22c55e" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Pixel / Neon Snake Segments -->
  <rect x="12" y="36" width="10" height="10" rx="2" fill="#15803d" />
