    <script>
      // In cloud preview iframe, Vite HMR WebSocket is not available. Provide silent mock so dev server client never errors.
      (function() {
        const NativeWS = window.WebSocket;
        if (!NativeWS) return;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('vite') || url.includes('run.app') || url.includes('3000'))) {
            const handlers = {};
            const fake = {
              url: url,
              readyState: 1, // OPEN
              CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3,
              binaryType: 'blob', bufferedAmount: 0, extensions: '', protocol: '',
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                if (!handlers[type]) handlers[type] = [];
                handlers[type].push(fn);
                if (type === 'open') setTimeout(() => { try { fn(new Event('open')); } catch (_) {} }, 10);
              },
              removeEventListener: function(type, fn) {
                if (handlers[type]) handlers[type] = handlers[type].filter(h => h !== fn);
              },
              dispatchEvent: function() { return true; },
              onopen: null, onclose: null, onerror: null, onmessage: null
            };
            setTimeout(() => {
              if (typeof fake.onopen === 'function') {
                try { fake.onopen(new Event('open')); } catch (_) {}
              }
            }, 10);
            return fake;
          }
          return new NativeWS(url, protocols);
        };
        window.WebSocket.prototype = NativeWS.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      })();
    </script>
